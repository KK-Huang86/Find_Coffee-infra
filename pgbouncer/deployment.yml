apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: find-coffee
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          ports:
            - containerPort: 5432
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: find-coffee-config
                  key: POSTGRESQL_HOST
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: find-coffee-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: find-coffee-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: find-coffee-secret
                  key: DB_PASSWORD
            - name: POOL_MODE
              value: transaction
            - name: MAX_DB_CONNECTIONS
              value: "20"
            - name: DEFAULT_POOL_SIZE
              value: "10"
            - name: AUTH_TYPE
              value: scram-sha-256
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 10
