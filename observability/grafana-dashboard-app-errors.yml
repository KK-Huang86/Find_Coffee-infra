apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-app-errors
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  app-errors.json: |
    {
      "title": "應用錯誤日誌",
      "uid": "app-errors",
      "schemaVersion": 39,
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "1m",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "錯誤日誌筆數（每分鐘）",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum by (pod) (count_over_time({namespace=\"find-coffee\"} |~ \"(?i)(error|exception|traceback)\" [1m]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "logs",
          "title": "最近的應用錯誤日誌",
          "gridPos": { "h": 14, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{namespace=\"find-coffee\"} |~ \"(?i)(error|exception|traceback)\""
            }
          ]
        }
      ]
    }
