apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 12.11.0
    helm:
      valuesObject:
        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password

        # 對外走 /grafana 子路徑（見 observability/grafana-ingress.yml），
        # 沒有這兩個設定，登入 redirect、靜態資源、Grafana Live(WebSocket) 都會導到錯誤路徑
        grafana.ini:
          server:
            root_url: https://194.195.126.243.nip.io/grafana/
            serve_from_sub_path: true
          # Grafana 12+ 預設會在啟動時背景下載安裝一批內建 app plugin（grafana-lokiexplore-app 等），
          # 對外網路呼叫常常逾時，拖慢啟動速度到 liveness probe 判定逾時、被 kubelet 反覆重啟，關掉它
          plugins:
            preinstall_disabled: true

        sidecar:
          dashboards:
            enabled: true
            # label 用 chart 預設值 grafana_dashboard，跟 observability/grafana-dashboard-*.yml 的 label 對齊
          datasources:
            enabled: true
            # label 用 chart 預設值 grafana_datasource，跟 observability/grafana-datasource-configmap.yml 對齊

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi

        # 跟其他 observability 元件盡量分散到不同 node，避免全部擠在同一台 2GB node
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/instance
                        operator: In
                        values: [prometheus, loki, grafana, kube-state-metrics]

        # rollout 換版時新舊 pod 別同時存在，減少換版當下的記憶體尖峰
        deploymentStrategy:
          type: Recreate
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
